[package]
name = "pocketpod"
version = "0.5.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# Hay dos binarios: la app (`pocketpod`) y el servidor de diagnóstico
# (`pocketall`). Sin esto, `cargo run` falla porque no sabe cuál elegir.
default-run = "pocketpod"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pocketpod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
# Puente local de música (PocketAll): HTTP en 127.0.0.1 + InnerTube.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tower-http = { version = "0.6", features = ["cors"] }
async-trait = "0.1"
# Inicio de sesión con Google en Windows (PKCE).
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media", "Media_Control", "Storage_Streams", "System", "Data_Xml_Dom"] }
windows-future = "0.3.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
