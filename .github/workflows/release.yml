name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FoYu ${{ github.ref_name }}"
          releaseBody: |
            FoYu para Windows y Android.

            **Windows**: descarga `FoYu_*_x64-setup.exe` (recomendado) o el `.msi`.
            **Android**: descarga `FoYu_<versión>_arm64.apk`.

            Busca y escucha música, crea playlists, importa desde otros
            servicios, exporta tu biblioteca y añade widgets en Android. Tus datos se quedan en tu
            dispositivo: esta versión no incluye cuenta ni copia en la nube.

            Android puede avisar que la app no viene de Play Store.
            FoYu no está afiliada a YouTube, Google, Spotify, Apple ni Deezer.
          releaseDraft: true
          prerelease: false

  build-android:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El runner de Ubuntu ya trae el SDK de Android, build-tools 37 y el NDK 27.
      # Solo instalamos lo que falte para no depender de una acción externa.
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true
          SM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          need=0
          [ -d "$ANDROID_HOME/platforms/android-37.0" ] || need=1
          [ -d "$ANDROID_HOME/build-tools/37.0.0" ] || need=1
          if [ "$need" = "1" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-37.0" "build-tools;37.0.0"
          else
            echo "platform 37.0 y build-tools 37.0.0 ya presentes"
          fi

      - name: Select NDK
        run: |
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "No hay ningún NDK 27 instalado en $ANDROID_HOME/ndk" >&2
            exit 1
          fi
          echo "NDK seleccionado: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/pocketpod-release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=../pocketpod-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Build APK
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_PRIVACY_POLICY_URL: ${{ vars.VITE_PRIVACY_POLICY_URL }}
        run: npm run tauri android build -- --apk --target aarch64

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' | head -n 1)"
          echo "APK: $APK_PATH"
          cp "$APK_PATH" "FoYu_${VERSION}_arm64.apk"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "FoYu_${GITHUB_REF_NAME#v}_arm64.apk" --clobber
