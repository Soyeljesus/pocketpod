name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PocketPod ${{ github.ref_name }}"
          releaseBody: |
            PocketPod para Windows y Android.

            **Windows**: descarga `PocketPod_*_x64-setup.exe` (recomendado) o el `.msi`.
            **Android**: descarga `PocketPod_<versión>_arm64.apk`.

            Requiere la app de escritorio/móvil de Spotify o Apple Music.
            En Android, concede el acceso a notificaciones la primera vez.
          releaseDraft: true
          prerelease: false

  build-android:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El runner de Ubuntu ya trae el SDK de Android, build-tools 37 y el NDK 27.
      # Solo instalamos lo que falte para no depender de una acción externa.
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true
          SM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          need=0
          [ -d "$ANDROID_HOME/platforms/android-37.0" ] || need=1
          [ -d "$ANDROID_HOME/build-tools/37.0.0" ] || need=1
          if [ "$need" = "1" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-37.0" "build-tools;37.0.0"
          else
            echo "platform 37.0 y build-tools 37.0.0 ya presentes"
          fi

      - name: Select NDK
        run: |
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "No hay ningún NDK 27 instalado en $ANDROID_HOME/ndk" >&2
            exit 1
          fi
          echo "NDK seleccionado: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/pocketpod-release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=../pocketpod-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Build APK
        run: npm run tauri android build -- --apk --target aarch64

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' | head -n 1)"
          echo "APK: $APK_PATH"
          cp "$APK_PATH" "PocketPod_${VERSION}_arm64.apk"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "PocketPod_${GITHUB_REF_NAME#v}_arm64.apk" --clobber
